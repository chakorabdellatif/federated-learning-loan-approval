name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-and-syntax:
    name: Lint & syntax check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [server, clients, kafka, dashboards]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install service dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.service }}/requirements.txt
          pip install flake8

      - name: Byte-compile (syntax check)
        run: python -m py_compile ${{ matrix.service }}/*.py

      - name: Flake8 (critical errors only)
        run: python -m flake8 --max-line-length=120 --select=E9,F63,F7,F82 ${{ matrix.service }}

  validate-compose:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml syntax
        run: docker compose config -q
